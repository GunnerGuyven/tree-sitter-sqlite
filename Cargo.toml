[package]
name = "tree-sitter-sqlite"
description = "Sqlite grammar for tree-sitter"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "sqlite"]
categories = ["parsing", "text-editors"]
repository = "github:gunnerguyven/tree-sitter-sqlite"
edition = "2021"
authors = ["guyven <guyven@pm.me>"]
license = "MIT"
readme = "README.md"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.24.3"
c = "1.0"
